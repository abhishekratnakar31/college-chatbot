services:
  postgres:
    image: postgres:16-alpine
    container_name: college-chatbot-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: college_chatbot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: college-chatbot-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  server:
    build: ./server
    ports:
      - "4006:4006"
    environment:
      - PORT=4006
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/college_chatbot
      - QDRANT_URL=http://qdrant:6333
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-nvidia/nemotron-3.5-lightning:free}
      - CHAT_HISTORY_LIMIT=${CHAT_HISTORY_LIMIT:-20}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - ELEVEN_LABS_API_KEY=${ELEVEN_LABS_API_KEY}
      - NODE_ENV=production
    depends_on:
      - postgres
      - qdrant
    restart: always

  web:
    build:
      context: ./web
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:4006
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4006
      - NODE_ENV=production
    restart: always
    depends_on:
      - server

volumes:
  postgres_data:
  qdrant_data:
